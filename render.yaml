services:
  - type: web
    name: atlas-nft-marketplace-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:api
    disk:
      name: atlas-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_PATH
        value: /var/data/atlas.sqlite
      - key: PUBLIC_API_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: VITE_NFT_CONTRACT_ADDRESS
        sync: false
      - key: VITE_MARKETPLACE_CONTRACT_ADDRESS
        sync: false
      - key: NFT_CONTRACT_ADDRESS
        sync: false
      - key: MARKETPLACE_CONTRACT_ADDRESS
        sync: false
